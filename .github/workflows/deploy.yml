name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; let a run in progress finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # The build inlines everything into one file. If that ever regresses into
      # referencing an external host, fail here rather than shipping a page that
      # breaks offline and leaks requests to third parties.
      - name: Assert the page is self-contained
        run: |
          test -f dist/index.html
          if grep -qE '<(script|link|img)[^>]+(src|href)="https?://' dist/index.html; then
            echo "::error::dist/index.html loads an external resource"; exit 1
          fi
          if grep -qE '\bfetch\(|XMLHttpRequest' dist/index.html; then
            echo "::error::dist/index.html makes network calls"; exit 1
          fi
          echo "self-contained OK ($(wc -c < dist/index.html) bytes)"

      # Jekyll would otherwise ignore files, and there is nothing to process.
      - run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
